<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Наша семья</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* layout: one wide column; lock card centred; chronicle as a year rail + card grid */
:root{--bg:#eef0ee;--paper:#f8f9f7;--ink:#1f2622;--muted:#5f6b64;--line:#d5dad5;--accent:#6e2f3a;--accent-ink:#fff;
--display:"Cormorant Garamond",Georgia,serif;--body:"Golos Text",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--paper:#1c211e;--ink:#e6e9e6;--muted:#9aa59e;--line:#2e3631;--accent:#d88d99;--accent-ink:#141815;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.gut{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));max-width:1180px;margin:0 auto}
/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:34px 30px;width:min(420px,100%);text-align:center}
.card h1{font:600 40px/1.1 var(--display);margin:6px 0 6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card p{color:var(--muted);margin:0 0 20px}
.card input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.06em}
.card label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 18px}
.card button{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:12px 26px;cursor:pointer;width:100%}
.err{color:var(--accent);min-height:1.5em;margin-top:12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* site */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-top:28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top h1{font:600 46px/1 var(--display);margin:4px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500}
.tabs a[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.pane{padding:26px 0 40px}
.pane h2{font:600 34px/1.15 var(--display);margin:0 0 8px}
.lead{color:var(--muted);max-width:64ch;margin:0 0 22px}
.yrs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:3}
.yrs a{font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px}
.yrs a:hover{border-color:var(--accent)}
.yr{scroll-margin-top:60px}
.yr h3{font:600 30px/1 var(--display);color:var(--accent);margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.vid{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--line)}
.vid:hover img{outline:2px solid var(--accent)}
.vid:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.vt{font-weight:500;line-height:1.3}
.vn{font-size:13px;color:var(--muted)}
.todo{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:760px}
.todo h3{font:600 22px/1.2 var(--display);margin:4px 0 8px}
.todo ul{margin:0 0 14px;padding-left:20px}
.foot{color:var(--muted);font-size:13px;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}
#player{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;place-items:center;z-index:20;padding:20px}
#player.on{display:grid}
#player iframe{width:min(1280px,100%);aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#player button{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));font:600 16px var(--body);background:#fff;color:#111;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
/* grandkids */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:10px}
.kid{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.kid:hover,.kid:focus-visible{border-color:var(--accent)}
.kid .ph{aspect-ratio:1;border-radius:8px;background:var(--line);overflow:hidden;display:grid;place-items:center;font:600 54px var(--display);color:var(--muted)}
.kid .ph img{width:100%;height:100%;object-fit:cover}
.kid b{font:600 26px/1.1 var(--display)}.kid small{color:var(--muted)}
.kback{all:unset;cursor:pointer;color:var(--accent);font-weight:500;display:inline-block;margin:6px 0 10px}
.khead h2{font:600 48px/1 var(--display);margin:0 0 6px}
.khead p{color:var(--muted);margin:0 0 16px}
.kbtn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:11px 18px;margin:0 0 6px}
.kyr h3{font:600 30px/1 var(--display);color:var(--accent);margin:30px 0 4px}.kyr h3 span{font:500 16px var(--body);color:var(--muted);margin-left:10px}
.kgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.kgal button{all:unset;cursor:zoom-in;display:block}
.kgal img,.kgal .ph0{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.kgal button:focus-visible img{outline:2px solid var(--accent);outline-offset:2px}
.kvids{margin-top:12px}
.kempty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:18px 22px;color:var(--muted)}
#klb{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;touch-action:pan-y;user-select:none}
#klb img{max-width:100vw;max-height:calc(100vh - 100px);object-fit:contain}
#klb p{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#eee;margin:0;padding:0 70px;text-shadow:0 1px 4px #000}
#klb .cnt{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;color:#aaa}
#klb .nb{all:unset;cursor:pointer;position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(30,30,30,.7);border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-size:26px;box-sizing:border-box}
#klb .nb:focus-visible,#klb .nb:hover{background:#fff;color:#111}
#klb .p{left:12px;top:calc(50% - 27px)}#klb .n{right:12px;top:calc(50% - 27px)}#klb .c{right:12px;top:max(10px,env(safe-area-inset-top));font-size:20px}
#klb .pl{right:76px;top:max(10px,env(safe-area-inset-top));font-size:18px}
@media (max-width:600px){.kgal{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.khead h2{font-size:40px}#klb p{padding:0 14px}}
@media (max-width:600px){.top h1{font-size:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<div id="lock">
  <form class="card" id="f" autocomplete="on">
    <span class="eyebrow">Закрытый семейный сайт</span>
    <h1>Наша семья</h1>
    <p>Введите семейный пароль</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus aria-label="Пароль">
    <label><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
    <button type="submit" id="go">Войти</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<div id="klb" hidden role="dialog" aria-label="Фото"><img id="klbI" alt=""><span class="cnt" id="klbN"></span><p id="klbC"></p><button class="nb p" type="button" aria-label="Предыдущее">‹</button><button class="nb n" type="button" aria-label="Следующее">›</button><button class="nb pl" type="button" aria-label="Слайд-шоу">▶</button><button class="nb c" type="button" aria-label="Закрыть">✕</button></div>
<div id="player" role="dialog" aria-label="Видео"><button type="button" id="close">Закрыть ✕</button><iframe id="fr" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Видео"></iframe></div>

    b.append(ph);const nm=document.createElement('b');nm.textContent=k.name;const sm=document.createElement('small');sm.textContent=age(k.born,today)+(k.photos.length||k.videos.length?'':' · страница готовится');b.append(nm,sm);list.append(b)});
  let LB=[],li=0,K0=null,sT=null;const lbE=document.getElementById('klb');
  function lb(arr,i,kid){if(arr){LB=arr;K0=kid}li=(i+LB.length)%LB.length;const p=LB[li];const im=document.getElementById('klbI');im.removeAttribute('src');url(p[1]).then(u=>{if(LB[li]===p)im.src=u});
    document.getElementById('klbC').textContent=fmtD(p[2])+' · '+age(K0.born,p[2]);document.getElementById('klbN').textContent=(li+1)+' / '+LB.length;
    const nx=LB[(li+1)%LB.length];if(nx)url(nx[1]);lbE.hidden=false}
  function stopSS(){clearInterval(sT);sT=null;lbE.querySelector('.pl').textContent='▶'}
  lbE.querySelector('.p').onclick=()=>lb(null,li-1);lbE.querySelector('.n').onclick=()=>lb(null,li+1);
  lbE.querySelector('.c').onclick=()=>{stopSS();lbE.hidden=true};
  lbE.querySelector('.pl').onclick=()=>{if(sT){stopSS()}else{sT=setInterval(()=>lb(null,li+1),4500);lbE.querySelector('.pl').textContent='❚❚'}};
  let x0=null;lbE.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});lbE.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)lb(null,li+(dx<0?1:-1))},{passive:true});
  addEventListener('keydown',e=>{if(lbE.hidden)return;if(e.key==='ArrowLeft')lb(null,li-1);else if(e.key==='ArrowRight')lb(null,li+1);else if(e.key==='Escape'||e.key==='Backspace'||e.keyCode===10009||e.keyCode===461){e.preventDefault();e.stopImmediatePropagation();stopSS();lbE.hidden=true}},true);
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  window.__kid=id=>{const k=KD.kids.find(x=>x.id===id);list.hidden=!!k;document.querySelector('#grandkids>.lead').hidden=!!k;document.querySelector('#grandkids>h2').hidden=!!k;page.textContent='';if(!k)return;
    const h=document.createElement('div');h.className='khead';
    h.innerHTML=`<a class="kback" href="#grandkids">← Все внуки</a><h2>${esc(k.name)}</h2><p>Дата рождения: ${fmtD(k.born)} · сейчас ${age(k.born,today)}${k.parents?' · мама и папа: '+esc(k.parents):''}</p>`;
    if(k.photos.length){const sb=document.createElement('button');sb.className='kbtn';sb.type='button';sb.textContent='▶ Слайд-шоу: все фото по порядку';sb.onclick=()=>{lb(k.photos,0,k);lbE.querySelector('.pl').click()};h.append(sb)}
    page.append(h);
    if(!k.photos.length&&!k.videos.length){const e=document.createElement('div');e.className='kempty';e.textContent='Страница готовится: скоро здесь появятся фото и видео по годам.';page.append(e);return}
    const by=new Date(k.born).getFullYear(),years=new Set([...k.photos.map(p=>+p[2].slice(0,4)),...k.videos.map(v=>+v[2].slice(0,4))]);
    [...years].sort((a,b)=>a-b).forEach(y=>{const sec=document.createElement('section');sec.className='kyr';const a=y-by;
      sec.innerHTML=`<h3>${y}<span>${a<=0?'первый год':a+' '+plY(a)}</span></h3>`;
      const ps=k.photos.filter(p=>p[2].startsWith(y+''));if(ps.length){const g=document.createElement('div');g.className='kgal';
        ps.forEach(p=>{const b=document.createElement('button');b.type='button';const im=document.createElement('img');im.alt=fmtD(p[2]);im.dataset.e=p[0];io.observe(im);b.append(im);b.onclick=()=>lb(k.photos,k.photos.indexOf(p),k);g.append(b)});sec.append(g)}
      const vs=k.videos.filter(v=>v[2].startsWith(y+''));if(vs.length){const g=document.createElement('div');g.className='grid kvids';
        vs.forEach(([v,t,d])=>{const b=document.createElement('button');b.className='vid';b.type='button';b.dataset.v=v;b.innerHTML=`<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v}/mqdefault.jpg"><span class="vt">${esc(t)}</span><span class="vn">${fmtD(d)} · ${age(k.born,d)}</span>`;g.append(b)});sec.append(g)}
      page.append(sec)});window.scrollTo(0,0)};
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value.trim(),err=document.getElementById('err'),go=document.getElementById('go');
  go.disabled=true;go.textContent='Открываю…';err.textContent='';
  try{const h=await open_(pw);try{if(document.getElementById('rem').checked)localStorage.setItem(K,pw)}catch(_){}show(h)}
  catch(_){err.textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.'}
  go.disabled=false;go.textContent='Войти'});
(async()=>{let pw=null;try{pw=localStorage.getItem(K)}catch(_){}
  if(pw){try{show(await open_(pw))}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script>
