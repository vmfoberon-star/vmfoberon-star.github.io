<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Наша семья</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* layout: one wide column; lock card centred; chronicle as a year rail + card grid */
:root{--bg:#eef0ee;--paper:#f8f9f7;--ink:#1f2622;--muted:#5f6b64;--line:#d5dad5;--accent:#6e2f3a;--accent-ink:#fff;
--display:"Cormorant Garamond",Georgia,serif;--body:"Golos Text",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--paper:#1c211e;--ink:#e6e9e6;--muted:#9aa59e;--line:#2e3631;--accent:#d88d99;--accent-ink:#141815;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.gut{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));max-width:1180px;margin:0 auto}
/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:34px 30px;width:min(420px,100%);text-align:center}
.card h1{font:600 40px/1.1 var(--display);margin:6px 0 6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card p{color:var(--muted);margin:0 0 20px}
.card input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-align:center;letter-spacing:.06em}
.card label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 18px}
.card button{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);padding:12px 26px;cursor:pointer;width:100%}
.err{color:var(--accent);min-height:1.5em;margin-top:12px;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* site */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-top:28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top h1{font:600 46px/1 var(--display);margin:4px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs a{color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:500}
.tabs a[aria-current=page]{background:var(--accent);color:var(--accent-ink)}
.pane{padding:26px 0 40px}
.pane h2{font:600 34px/1.15 var(--display);margin:0 0 8px}
.lead{color:var(--muted);max-width:64ch;margin:0 0 22px}
.yrs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:3}
.yrs a{font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:14px}
.yrs a:hover{border-color:var(--accent)}
.yr{scroll-margin-top:60px}
.yr h3{font:600 30px/1 var(--display);color:var(--accent);margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.vid{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.vid img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--line)}
.vid:hover img{outline:2px solid var(--accent)}
.vid:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.vt{font-weight:500;line-height:1.3}
.vn{font-size:13px;color:var(--muted)}
.todo{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 24px;max-width:760px}
.todo h3{font:600 22px/1.2 var(--display);margin:4px 0 8px}
.todo ul{margin:0 0 14px;padding-left:20px}
.foot{color:var(--muted);font-size:13px;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}
#player{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;place-items:center;z-index:20;padding:20px}
#player.on{display:grid}
#player iframe{width:min(1280px,100%);aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
#player button{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));font:600 16px var(--body);background:#fff;color:#111;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
/* grandkids */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:10px}
.kid{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.kid:hover,.kid:focus-visible{border-color:var(--accent)}
.kid .ph{aspect-ratio:1;border-radius:8px;background:var(--line);overflow:hidden;display:grid;place-items:center;font:600 54px var(--display);color:var(--muted)}
.kid .ph img{width:100%;height:100%;object-fit:cover}
.kid b{font:600 26px/1.1 var(--display)}.kid small{color:var(--muted)}
.kback{all:unset;cursor:pointer;color:var(--accent);font-weight:500;display:inline-block;margin:6px 0 10px}
.khead h2{font:600 48px/1 var(--display);margin:0 0 6px}
.khead p{color:var(--muted);margin:0 0 16px}
.kbtn{all:unset;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:11px 18px;margin:0 0 6px}
.kyr h3{font:600 30px/1 var(--display);color:var(--accent);margin:30px 0 4px}.kyr h3 span{font:500 16px var(--body);color:var(--muted);margin-left:10px}
.kgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.kgal button{all:unset;cursor:zoom-in;display:block}
.kgal img,.kgal .ph0{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.kgal button:focus-visible img{outline:2px solid var(--accent);outline-offset:2px}
.kvids{margin-top:12px}
.kempty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:18px 22px;color:var(--muted)}
#klb{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;touch-action:pan-y;user-select:none}
#klb img{max-width:100vw;max-height:calc(100vh - 100px);object-fit:contain}
#klb p{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#eee;margin:0;padding:0 70px;text-shadow:0 1px 4px #000}
#klb .cnt{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;color:#aaa}
#klb .nb{all:unset;cursor:pointer;position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(30,30,30,.7);border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-size:26px;box-sizing:border-box}
#klb .nb:focus-visible,#klb .nb:hover{background:#fff;color:#111}
#klb .p{left:12px;top:calc(50% - 27px)}#klb .n{right:12px;top:calc(50% - 27px)}#klb .c{right:12px;top:max(10px,env(safe-area-inset-top));font-size:20px}
#klb .pl{right:76px;top:max(10px,env(safe-area-inset-top));font-size:18px}
/* timeline */
.tlf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tlf button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:15px;display:inline-flex;align-items:center;gap:7px}
.tlf button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tlf button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tlg{display:grid;grid-template-columns:72px repeat(5,minmax(0,1fr));column-gap:10px;row-gap:10px;position:relative}
.tlh{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);font:600 20px/1.1 var(--display);display:flex;flex-direction:column;gap:2px}
.tlh small{font:400 12px var(--body);color:var(--muted)}
.tlh .nm{display:flex;align-items:center;gap:7px}
.tlm{font:600 18px/1.1 var(--display);color:var(--accent);padding-top:6px;border-top:1px solid var(--line)}
.tll{width:3px;justify-self:center;border-radius:2px;opacity:.35;z-index:0}
.tle{all:unset;cursor:pointer;position:relative;z-index:1;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tle.fam{flex-direction:row;border-left-width:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,var(--paper)),var(--paper))}
.tle:hover,.tle:focus-visible{border-color:var(--accent)}
.tle img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line);display:block}
.tle.fam img{width:min(200px,30%);aspect-ratio:16/9;flex:none}
.tle .tx{padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tle b{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.tle small{color:var(--muted);font-size:13px}
.tle .who{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tlg.one,.tlg.mob{display:block}
.tlg.one .tlh,.tlg.one .tll,.tlg.mob .tlh,.tlg.mob .tll{display:none}
.tlg.one .tlm,.tlg.mob .tlm{margin:22px 0 10px}
.tlg.one .tle,.tlg.mob .tle{margin-bottom:10px;flex-direction:row;width:100%;box-sizing:border-box}
.tlg.one .tle img,.tlg.mob .tle img{width:min(200px,38%);aspect-ratio:3/2;flex:none}
#tla{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:20px max(16px,4vw) 40px}
#tla[hidden]{display:none}
#tla .x{all:unset;cursor:pointer;color:var(--accent);font-weight:500;display:inline-block;margin-bottom:8px}
#tla h3{font:600 34px/1.1 var(--display);margin:0 0 4px}
#tla p{color:var(--muted);margin:0 0 14px}
/* tree */
.trs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.trs input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:min(320px,100%);flex:1 1 240px;max-width:420px}
.trh{all:unset;cursor:pointer;color:var(--accent);font-weight:500;padding:9px 4px}
.trrow{margin:0 0 14px}.trrow>h4{font:500 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.trcards{display:flex;flex-wrap:wrap;gap:8px}
.trc{all:unset;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--sx,var(--line));border-radius:9px;padding:8px 12px;min-width:150px;max-width:260px;box-sizing:border-box}
.trc:hover,.trc:focus-visible{border-color:var(--accent)}
.trc b{display:block;font-weight:600;line-height:1.25}.trc small{color:var(--muted);font-size:13px}
.trc.m{--sx:#5b7fa6}.trc.f{--sx:#b0607e}
.trfocus{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:18px 22px;margin:4px 0 18px;max-width:760px}
.trfocus h3{font:600 36px/1.1 var(--display);margin:0 0 6px}
.trfocus p{margin:4px 0;color:var(--ink)}.trfocus .mu{color:var(--muted);font-size:14px}
.trfocus .nt{white-space:pre-line;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.trfam{border-left:2px solid var(--line);padding-left:12px;margin:0 0 12px}
.trfam>p{margin:0 0 6px;color:var(--muted);font-size:14px}
.tridx{margin-top:26px;max-width:860px}.tridx summary{cursor:pointer;color:var(--accent);font-weight:500}
.tridx h5{font:600 18px var(--display);margin:14px 0 4px;color:var(--accent)}
.tridx a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted);margin-right:12px;line-height:2}
.trnote{color:var(--muted);font-size:14px;margin-top:20px;max-width:64ch}
@media (max-width:600px){.kgal{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.khead h2{font-size:40px}#klb p{padding:0 14px}}
@media (max-width:600px){.top h1{font-size:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
</head>
<body>
<div id="lock">
  <form class="card" id="f" autocomplete="on">
    <span class="eyebrow">Закрытый семейный сайт</span>
    <h1>Наша семья</h1>
    <p>Введите семейный пароль</p>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus aria-label="Пароль">
    <label><input type="checkbox" id="rem" checked> Запомнить на этом устройстве</label>
    <button type="submit" id="go">Войти</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>
<div id="app" hidden></div>
<div id="klb" hidden role="dialog" aria-label="Фото"><img id="klbI" alt=""><span class="cnt" id="klbN"></span><p id="klbC"></p><button class="nb p" type="button" aria-label="Предыдущее">‹</button><button class="nb n" type="button" aria-label="Следующее">›</button><button class="nb pl" type="button" aria-label="Слайд-шоу">▶</button><button class="nb c" type="button" aria-label="Закрыть">✕</button></div>
<div id="player" role="dialog" aria-label="Видео"><button type="button" id="close">Закрыть ✕</button><iframe id="fr" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Видео"></iframe></div>

    const kids=KD.kids,ix=Object.fromEntries(kids.map((k,i)=>[k.id,i])),byId=Object.fromEntries(kids.map(k=>[k.id,k]));
    const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const bornBy=(k,ym)=>k.born.slice(0,7)<=ym;
    const title=e=>e.t;
    const cnt=e=>[e.ph.length?e.ph.length+' фото':'',e.v.length?e.v.length+' видео':''].filter(Boolean).join(' · ');
    let sel='all';
    const al=document.createElement('div');al.id='tla';al.hidden=true;al.setAttribute('role','dialog');document.getElementById('timeline').append(al);
    function album(e){al.textContent='';const x=document.createElement('button');x.className='x';x.type='button';x.textContent='← Назад к линии времени';x.onclick=()=>{al.hidden=true;document.body.style.overflow=''};
      const h=document.createElement('h3');h.textContent=title(e);
      const [y,m]=e.ym.split('-').map(Number);const p=document.createElement('p');
      const ages=kids.filter(k=>(e.kind==='kid'?e.who.includes(k.id):bornBy(k,e.ym))).map(k=>k.name+' — '+age(k.born,e.ym+'-15')).join(', ');
      p.textContent=MN[m-1]+' '+y+(ages?' · '+ages:'');al.append(x,h,p);
      const pk={cap:title(e)};
      if(e.ph.length){const g=document.createElement('div');g.className='kgal';e.ph.forEach((ph,i)=>{const b=document.createElement('button');b.type='button';const im=document.createElement('img');im.alt='';im.dataset.e=ph[0];io.observe(im);b.append(im);b.onclick=()=>lb(e.ph,i,pk);g.append(b)});al.append(g)}
      if(e.v.length){const g=document.createElement('div');g.className='grid kvids';e.v.forEach(([v,t,d])=>{const b=document.createElement('button');b.className='vid';b.type='button';b.dataset.v=v;b.innerHTML=`<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v}/mqdefault.jpg"><span class="vt">${esc(t)}</span><span class="vn">${fmtD(d)}</span>`;g.append(b)});al.append(g)}
      al.hidden=false;al.scrollTop=0;document.body.style.overflow='hidden'}
    function card(e,fam){const b=document.createElement('button');b.type='button';b.className='tle'+(fam?' fam':'');
      if(!fam)b.style.setProperty('--c',COL[e.who[0]]);
      const im=document.createElement('img');im.alt='';if(e.ph.length){im.dataset.e=e.ph[0][0];io.observe(im)}else if(e.v.length)im.src='https://i.ytimg.com/vi/'+e.v[0][0]+'/mqdefault.jpg';b.append(im);
      const tx=document.createElement('span');tx.className='tx';const t=document.createElement('b');t.textContent=title(e);tx.append(t);
      const c=document.createElement('small');c.textContent=cnt(e);tx.append(c);
      if(fam){const w=document.createElement('span');w.className='who';const ks=kids.filter(k=>bornBy(k,e.ym));w.innerHTML=ks.map(k=>`<span class="dot" style="background:${COL[k.id]}" title="${esc(k.name)}"></span>`).join('')+' вся семья';tx.append(w)}
      b.append(tx);b.onclick=()=>album(e);return b}
    function render(){body.textContent='';const g=document.createElement('div');g.className='tlg';
      const mob=matchMedia('(max-width:700px)').matches;if(sel!=='all')g.classList.add('one');else if(mob)g.classList.add('mob');
      const ev=T.filter(e=>sel==='all'||(e.kind==='kid'?e.who[0]===sel:bornBy(byId[sel],e.ym)));
      const months=[...new Set(ev.map(e=>e.ym))].sort();
      if(!ev.length){const k=byId[sel];const em=document.createElement('div');em.className='kempty';em.textContent=k&&T.every(e=>!bornBy(k,e.ym))?k.name+' родится в '+k.born.slice(0,4)+' году — его дорожка начнётся там.':'За этот период событий пока нет.';body.append(em);return}
      let row=1;
      if(!g.classList.contains('one')&&!mob){const h0=document.createElement('div');h0.className='tlh';h0.style.gridRow='1';h0.style.gridColumn='1';g.append(h0);
        kids.forEach((k,i)=>{const h=document.createElement('div');h.className='tlh';h.style.gridRow='1';h.style.gridColumn=String(i+2);
          const y0=months[0]?months[0].slice(0,4):'';h.innerHTML=`<span class="nm"><span class="dot" style="background:${COL[k.id]}"></span>${esc(k.name)}</span><small>${k.born.slice(0,4)>y0?'родится в '+k.born.slice(0,4):'в '+y0+': '+age(k.born,y0+'-12-31')}</small>`;g.append(h)});row=2}
      const r0=row;
      months.forEach(ym=>{const es=ev.filter(e=>e.ym===ym),fam=es.filter(e=>e.kind!=='kid'),kd=es.filter(e=>e.kind==='kid');
        const per={};kd.forEach(e=>{(per[e.who[0]]=per[e.who[0]]||[]).push(e)});const kr=Math.max(0,...Object.values(per).map(a=>a.length));
        const n=fam.length+kr;const [y,m]=ym.split('-').map(Number);
        const ml=document.createElement('div');ml.className='tlm';ml.textContent=MN[m-1]+(g.classList.contains('one')||mob?' '+y:'');ml.style.gridColumn='1';ml.style.gridRow=row+' / span '+n;g.append(ml);
        fam.forEach((e,i)=>{const c=card(e,true);c.style.gridColumn='2 / -1';c.style.gridRow=String(row+i);g.append(c)});
        Object.entries(per).forEach(([k,a])=>a.forEach((e,i)=>{const c=card(e,false);c.style.gridColumn=String(ix[k]+2);c.style.gridRow=String(row+fam.length+i);g.append(c)}));
        row+=n});
      if(!g.classList.contains('one')&&!mob)kids.forEach((k,i)=>{const st=months.findIndex(ym=>bornBy(k,ym));if(st<0)return;let rr=r0;for(let j=0;j<st;j++){const es=ev.filter(e=>e.ym===months[j]);const per={};es.filter(e=>e.kind==='kid').forEach(e=>{per[e.who[0]]=(per[e.who[0]]||0)+1});rr+=es.filter(e=>e.kind!=='kid').length+Math.max(0,...Object.values(per))}
        const l=document.createElement('div');l.className='tll';l.style.background=COL[k.id];l.style.gridColumn=String(i+2);l.style.gridRow=rr+' / '+row;g.prepend(l)});
      body.append(g)}
    const opts=[['all','Все вместе']].concat(kids.map(k=>[k.id,k.name]));
    opts.forEach(([id,nm])=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',id===sel);b.innerHTML=(id!=='all'?`<span class="dot" style="background:${COL[id]}"></span>`:'')+esc(nm);
      b.onclick=()=>{sel=id;fl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};fl.append(b)});
    render();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,200)});
    addEventListener('keydown',e=>{if(e.key==='Escape'&&!al.hidden&&document.getElementById('klb').hidden){al.hidden=true;document.body.style.overflow=''}});
  })();
  window.__kid=id=>{const k=KD.kids.find(x=>x.id===id);list.hidden=!!k;document.querySelector('#grandkids>.lead').hidden=!!k;document.querySelector('#grandkids>h2').hidden=!!k;page.textContent='';if(!k)return;
    const h=document.createElement('div');h.className='khead';
    h.innerHTML=`<a class="kback" href="#grandkids">← Все внуки</a><h2>${esc(k.name)}</h2><p>Дата рождения: ${fmtD(k.born)} · сейчас ${age(k.born,today)}${k.parents?' · мама и папа: '+esc(k.parents):''}</p>`;
    if(k.photos.length){const sb=document.createElement('button');sb.className='kbtn';sb.type='button';sb.textContent='▶ Слайд-шоу: все фото по порядку';sb.onclick=()=>{lb(k.photos,0,k);lbE.querySelector('.pl').click()};h.append(sb)}
    page.append(h);
    if(!k.photos.length&&!k.videos.length){const e=document.createElement('div');e.className='kempty';e.textContent='Страница готовится: скоро здесь появятся фото и видео по годам.';page.append(e);return}
    const by=new Date(k.born).getFullYear(),years=new Set([...k.photos.map(p=>+p[2].slice(0,4)),...k.videos.map(v=>+v[2].slice(0,4))]);
    [...years].sort((a,b)=>a-b).forEach(y=>{const sec=document.createElement('section');sec.className='kyr';const a=y-by;
      sec.innerHTML=`<h3>${y}<span>${a<=0?'первый год':a+' '+plY(a)}</span></h3>`;
      const ps=k.photos.filter(p=>p[2].startsWith(y+''));if(ps.length){const g=document.createElement('div');g.className='kgal';
        ps.forEach(p=>{const b=document.createElement('button');b.type='button';const im=document.createElement('img');im.alt=fmtD(p[2]);im.dataset.e=p[0];io.observe(im);b.append(im);b.onclick=()=>lb(k.photos,k.photos.indexOf(p),k);g.append(b)});sec.append(g)}
      const vs=k.videos.filter(v=>v[2].startsWith(y+''));if(vs.length){const g=document.createElement('div');g.className='grid kvids';
        vs.forEach(([v,t,d])=>{const b=document.createElement('button');b.className='vid';b.type='button';b.dataset.v=v;b.innerHTML=`<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v}/mqdefault.jpg"><span class="vt">${esc(t)}</span><span class="vn">${fmtD(d)} · ${age(k.born,d)}</span>`;g.append(b)});sec.append(g)}
      page.append(sec)});window.scrollTo(0,0)};
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value.trim(),err=document.getElementById('err'),go=document.getElementById('go');
  go.disabled=true;go.textContent='Открываю…';err.textContent='';
  try{const h=await open_(pw);try{if(document.getElementById('rem').checked)localStorage.setItem(K,pw)}catch(_){}show(h)}
  catch(_){err.textContent='Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.'}
  go.disabled=false;go.textContent='Войти'});
(async()=>{let pw=null;try{pw=localStorage.getItem(K)}catch(_){}
  if(pw){try{show(await open_(pw))}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script>
</body>
</html>
